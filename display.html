<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Display — Church Projector</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Sans+Malayalam:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/display.css">
</head>
<body>
  <div id="stage-inner">
    <div id="title-tag"></div>
    <div id="text-stack">
      <div id="main-text"></div>
      <div id="main-text-2" class="hidden"></div>
    </div>
    <div id="sub-ref"></div>
  </div>
  <div id="verse-footer"></div>
  <div id="idle-mark">Waiting for control panel…</div>
  <div id="blank-overlay"></div>

  <div id="net-status"></div>

  <button id="pair-open" type="button" title="Enter or change the display code">Code</button>
  <div id="pair-screen" class="hidden">
    <form id="pair-form" autocomplete="off">
      <div class="pair-title">Connect to control panel</div>
      <div class="pair-sub">Enter the code shown on the control panel</div>
      <input id="pair-input" type="text" inputmode="text" maxlength="6" autocapitalize="characters"
             autocomplete="off" autocorrect="off" spellcheck="false" placeholder="ABC123" aria-label="Display code">
      <button id="pair-go" type="submit">Connect</button>
      <div id="pair-error"></div>
      <button id="pair-skip" type="button">Use this window without a code</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/link.js"></script>
  <script src="js/display.js"></script>
</body>
</html>
