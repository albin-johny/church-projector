# Keeps the Supabase free-tier project from pausing after ~7 days of inactivity by making one
# tiny read request every 3 days. The URL and publishable key are the same public values that
# ship in js/config.js; the anon role can read live_state under RLS.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 5 */3 * *'   # every 3 days at 05:17 UTC
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: https://ipyusqmznihrarqijwwp.supabase.co
          SUPABASE_KEY: sb_publishable_hAunS1G-bpxyQ5YfMgZBfg_hwl4Jh4t
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/live_state?select=session_id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then exit 1; fi
